- id: clinicaltrials
  name: ClinicalTrials.gov (gene/cell therapy, BCI)
  domains: [biotech, neurotech]
  kind: commercial-data
  layer: commercial
  method: ctgov
  homepage: https://clinicaltrials.gov
  frequency: daily
  priority: 2
  reliability: Registry entries; results are not outcomes
  config:
    lookbackDays: 7
    phases: [PHASE1, PHASE2, PHASE3]
    pageSize: 50
    queries:
      - { label: gene therapy / editing, term: "gene therapy OR gene editing OR CRISPR OR base editing OR prime editing", domains: [biotech] }
      - { label: cell therapy, term: "CAR-T OR CAR T OR cell therapy", domains: [biotech] }
      - { label: BCI / neurostimulation, term: "brain-computer interface OR brain computer interface OR neural implant OR neurostimulation", domains: [neurotech] }

