# Source registry (REQUIREMENTS §5). Adding a source = adding an entry here.
# method: rss | arxiv | hf-papers | github-search | biorxiv | ctgov | page-monitor | manual
# kind:   research | product | newsletter | community | commercial-data
# layer:  scientific | engineering | product | commercial
# frequency: hourly | daily | weekly | yearly

- id: arxiv-cs-lg
  name: arXiv cs.LG
  domains: [ai]
  kind: research
  layer: scientific
  method: arxiv
  homepage: https://arxiv.org/list/cs.LG/recent
  frequency: daily
  priority: 1
  reliability: High provenance; claims are unreviewed preprints
  config: { category: cs.LG, maxResults: 200 }

