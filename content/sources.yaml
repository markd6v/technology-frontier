# Source registry (REQUIREMENTS §5). Adding a source = adding an entry here.
# Only primary sources: papers, lab research posts and official release channels.
# No general news, commentary, business or market coverage.
#
# method: rss | arxiv | hf-papers | github-search | biorxiv | ctgov | page-monitor | manual
# kind:   research | release | benchmark | press
# layer:  scientific | engineering | product
# frequency: hourly | daily | weekly | yearly
# filter (optional, applied to every fetched item; patterns are case-insensitive regexes):
#   categories: [..]   keep only items carrying one of these feed categories
#   includeTitle / excludeTitle / excludeUrl

# --- AI ---

- id: hf-daily-papers
  name: Hugging Face Daily Papers
  domains: [ai]
  kind: research
  layer: scientific
  method: hf-papers
  homepage: https://huggingface.co/papers
  frequency: hourly
  priority: 1
  reliability: Community-curated arXiv papers; only those with 20+ upvotes are kept
  config: { minUpvotes: 20 }

- id: openai-research
  name: OpenAI Research
  domains: [ai]
  kind: research
  layer: scientific
  method: rss
  homepage: https://openai.com/research/
  frequency: hourly
  priority: 1
  reliability: Lab research posts and system cards; results are self-reported
  config: { url: "https://openai.com/news/rss.xml", maxItems: 60 }
  filter:
    categories: [Research, Publication]

- id: openai-releases
  name: OpenAI Releases
  domains: [ai]
  kind: release
  layer: product
  method: rss
  homepage: https://openai.com/news/product-releases/
  frequency: hourly
  priority: 1
  reliability: Official model, API and engineering announcements
  config: { url: "https://openai.com/news/rss.xml", maxItems: 60 }
  filter:
    categories: [Product, Release, Engineering, API]
    excludeTitle: \b(ads?|advertising|pricing|seats?|partners?|partnership|teens?|webinar|expands?|data residency|now available on|comes? to|for (teachers|students|education|nonprofits|business|enterprises?|healthcare|financial services|government))\b

- id: anthropic-research
  name: Anthropic Research
  domains: [ai]
  kind: research
  layer: scientific
  method: page-monitor
  homepage: https://www.anthropic.com/research
  frequency: daily
  priority: 1
  reliability: Lab research posts; results are self-reported
  config:
    listUrl: https://www.anthropic.com/research
    linkSelector: 'a[href^="/research/"]'
    allowPrefix: https://www.anthropic.com/research/
    minLinks: 5
  filter:
    excludeUrl: /research/team/
    excludeTitle: \b(employment|jobs?|labou?r|workers?|economic\w*|expectations?|your thoughts)\b

- id: anthropic-releases
  name: Anthropic Releases
  domains: [ai]
  kind: release
  layer: product
  method: page-monitor
  homepage: https://www.anthropic.com/news
  frequency: daily
  priority: 1
  reliability: Model and product launches only; the newsroom's other posts are filtered out
  config:
    listUrl: https://www.anthropic.com/news
    linkSelector: 'a[href^="/news/"]'
    allowPrefix: https://www.anthropic.com/news/
    minLinks: 5
  filter:
    includeTitle: ^(Introducing|Announcing) Claude\b|\b(Claude|Opus|Sonnet|Haiku|Fable) \d

- id: google-deepmind
  name: Google DeepMind
  domains: [ai, robotics]
  kind: research
  layer: scientific
  method: rss
  homepage: https://deepmind.google/discover/blog/
  frequency: hourly
  priority: 1
  reliability: Lab research and model announcements; results are self-reported
  config: { url: "https://deepmind.google/blog/rss.xml", maxItems: 40 }
  filter:
    excludeTitle: \b(collaborat\w*|partner\w*|government|responsibl\w*|academy|award)\b

- id: google-research
  name: Google Research
  domains: [ai, compute]
  kind: research
  layer: scientific
  method: rss
  homepage: https://research.google/blog/
  frequency: daily
  priority: 2
  reliability: Lab research posts, usually with a paper
  config: { url: "https://research.google/blog/rss/", maxItems: 30 }
  filter:
    excludeTitle: ^Research@|\b(workers?|employment|economic\w*)\b

- id: hf-blog
  name: Hugging Face Blog
  domains: [ai]
  kind: release
  layer: engineering
  method: rss
  homepage: https://huggingface.co/blog
  frequency: daily
  priority: 2
  reliability: Open-weight model, dataset and library releases, often written by the releasing lab
  config: { url: "https://huggingface.co/blog/feed.xml", maxItems: 30 }

- id: artificial-analysis
  name: Artificial Analysis
  domains: [ai]
  kind: benchmark
  layer: engineering
  method: manual
  homepage: https://artificialanalysis.ai
  frequency: weekly
  priority: 1
  reliability: Independent benchmarks of model quality and speed
  config: {}

# --- Software, compute, security ---

- id: lwn
  name: LWN.net
  domains: [software]
  kind: press
  layer: engineering
  method: rss
  homepage: https://lwn.net
  frequency: daily
  priority: 2
  reliability: Technical reporting on Linux and open-source development; routine advisories filtered out
  config: { url: "https://lwn.net/headlines/rss", maxItems: 30 }
  filter:
    excludeTitle: ^security updates|stable kernels?|weekly edition|election|documentary|obituary

- id: project-zero
  name: Google Project Zero
  domains: [security]
  kind: research
  layer: scientific
  method: rss
  homepage: https://googleprojectzero.blogspot.com
  frequency: daily
  priority: 2
  reliability: Vulnerability research with full technical write-ups
  config: { url: "https://googleprojectzero.blogspot.com/feeds/posts/default?max-results=10", maxItems: 10 }

