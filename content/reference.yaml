# Cross-cutting reference content: universal sources, publications, interpreters
# and the cross-domain watchlist.

crossDomain:
  - { pair: AI + biology, domains: [ai, biotech], why: Programmable drug discovery and biological design }
  - { pair: AI + robotics, domains: [ai, robotics], why: General-purpose physical automation }
  - { pair: AI + semiconductors, domains: [ai, semiconductors], why: Automated chip design }
  - { pair: AI + energy, domains: [ai, energy-generation], why: "Power demand, grid optimization, new infrastructure" }
  - { pair: Materials + energy, domains: [materials, energy-storage], why: New battery chemistries and photovoltaic cells }
  - { pair: Space + communications, domains: [space, comms], why: Satellite-based connectivity }
  - { pair: Cryptography + finance, domains: [security, fintech], why: Programmable financial infrastructure }

universalSources:
  - { name: arXiv, url: https://arxiv.org, provides: Scientific preprints, advantage: Very early research signals }
  - { name: OpenAlex, url: https://openalex.org, provides: "Publications, citations, relationships", advantage: Discover emerging research clusters }
  - { name: Google Scholar, url: https://scholar.google.com, provides: Academic literature and citation tracking, advantage: Follow influential researchers and papers }
  - { name: GitHub Trending, url: https://github.com/trending, provides: Rapidly gaining open-source projects, advantage: Working code soon after a paper }
  - { name: Nature, url: https://www.nature.com, provides: Peer-reviewed scientific discoveries, advantage: Research validation }
  - { name: Science, url: https://www.science.org, provides: Major scientific discoveries, advantage: Research validation }
  - { name: Google Patents, url: https://patents.google.com, provides: Patent applications and technical inventions, advantage: Early indications of industrial R&D }

periodicReviews:
  - { name: Stanford Emerging Technology Review, url: https://setr.stanford.edu, note: Cross-disciplinary assessment of progress and barriers to deployment }
  - { name: "World Economic Forum: Top 10 Emerging Technologies", url: https://www.weforum.org/publications/series/top-10-emerging-technologies/, note: Annual selection of technologies approaching practical use }
  - { name: Stanford AI Index, url: https://hai.stanford.edu/ai-index, note: Yearly measurement of AI research output and capability }

publications:
  - { name: Import AI, url: https://importai.substack.com, focus: Weekly digest of notable AI papers, priority: true }
  - { name: Interconnects, url: https://www.interconnects.ai, focus: AI research and model development, priority: true }
  - { name: The Batch, url: https://www.deeplearning.ai/the-batch/, focus: AI developments }
  - { name: Quanta Magazine, url: https://www.quantamagazine.org, focus: "Mathematics, physics, biology and computer science research", priority: true }
  - { name: IEEE Spectrum, url: https://spectrum.ieee.org, focus: Engineering advances across fields, priority: true }
  - { name: MIT Technology Review, url: https://www.technologyreview.com, focus: Broad technology developments }
  - { name: SemiAnalysis, url: https://newsletter.semianalysis.com, focus: "Semiconductors, AI compute, infrastructure" }
  - { name: LWN.net, url: https://lwn.net, focus: Linux and open-source development }
  - { name: In the Pipeline, url: https://www.science.org/blogs/pipeline, focus: Drug discovery research, priority: true }

interpreters:
  - { name: Jack Clark, focus: AI research and measurement, why: Reads and summarizes a large share of each week's notable AI papers, priority: true, url: https://jack-clark.net }
  - { name: Nathan Lambert, focus: Open models and post-training, why: Explains how new models are built and how they compare, priority: true, url: https://www.interconnects.ai }
  - { name: Simon Willison, focus: Hands-on testing of new models and tools, why: Independently tries releases the day they ship, priority: true, url: https://simonwillison.net }
  - { name: Dwarkesh Patel, focus: "AI, computing, science", why: Long-form interviews with frontier researchers, priority: true, url: https://www.dwarkesh.com }
  - { name: Derek Lowe, focus: Medicinal chemistry and drug discovery, why: Separates real biology results from hype, url: https://www.science.org/blogs/pipeline }
  - { name: Scott Aaronson, focus: Quantum computing theory, why: Checks quantum-advantage claims against the evidence, url: https://scottaaronson.blog }
  - { name: Nat Friedman, focus: "Software, AI, scientific research", why: Connects research with working demonstrations }
  - { name: Patrick Collison, focus: "Science, technology, progress", why: Identifies important advances across disciplines }
