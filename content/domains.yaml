    - { name: Oxford Nanopore, url: https://nanoporetech.com/news }
  people:
    - { name: Jennifer Doudna, focus: CRISPR and gene editing }
    - { name: David Liu, focus: "Base editing, prime editing" }
    - { name: George Church, focus: "Synthetic biology, genomics" }
    - { name: Feng Zhang, focus: Genome engineering }
    - { name: David Baker, focus: Computational protein design }
    - { name: Aviv Regev, focus: Computational biology and genomics }
    - { name: Daphne Koller, focus: AI-driven drug discovery }
    - { name: Drew Endy, focus: Synthetic biology }
  signals:
    - Cost of sequencing a genome
    - Cost and speed of synthesizing DNA
    - Gene-editing accuracy and delivery efficiency
    - Protein-design success rates
    - Time from candidate discovery to clinical testing
    - Clinical trial outcomes
    - Manufacturing cost per treatment
  notes:
    - A breakthrough in a cell culture or animal model is not equivalent to an effective human treatment.
    - For commercial opportunities, delivery, safety, regulation, and manufacturing can matter more than the discovery.
    - ClinicalTrials.gov separates promising laboratory results from technologies being tested in humans.

