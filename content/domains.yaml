    - { name: NVIDIA Research, url: https://research.nvidia.com, note: Accelerated computing }
    - { name: Google Research, url: https://research.google, note: Large-scale systems and computing }
    - { name: Cloudflare Blog, url: https://blog.cloudflare.com, note: Networking and infrastructure engineering }
  products:
    - { name: NVIDIA Developer Blog, url: https://developer.nvidia.com/blog, note: "CUDA, GPUs, inference" }
    - { name: AMD, url: https://www.amd.com/en/newsroom.html, note: Accelerators and processors }
    - { name: AWS What's New, url: https://aws.amazon.com/new/, note: Cloud infrastructure }
    - { name: Google Cloud Blog, url: https://cloud.google.com/blog, note: Cloud and AI infrastructure }
    - { name: Microsoft Azure Updates, url: https://azure.microsoft.com/en-us/updates/, note: Infrastructure releases }
    - { name: CoreWeave, url: https://www.coreweave.com/blog, note: GPU cloud infrastructure }
    - { name: Nebius, url: https://nebius.com/blog, note: AI cloud and compute infrastructure }
  people:
    - { name: Jensen Huang, focus: "Accelerated computing, AI infrastructure strategy" }
    - { name: Jeff Dean, focus: Distributed computing and large-scale AI }
    - { name: Matei Zaharia, focus: "Distributed systems, Spark, ML infrastructure" }
    - { name: Ion Stoica, focus: "Distributed systems, cloud infrastructure" }
    - { name: Chris Lattner, focus: "Compilers, programming systems, AI compute" }
    - { name: Jim Keller, focus: Processor architecture }
    - { name: George Hotz, focus: Low-level systems and experimental compute }
  signals:
    - 10× cheaper inference
    - 5× better memory efficiency
    - A new interconnect architecture
    - A new compiler enabling previously impractical workloads
    - GPU utilization improving dramatically
  notes:
    - >-
      The most interesting signal is often not a new GPU but a change in the economics of
      computation; these can make entirely new products economical.

