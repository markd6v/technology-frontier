    - { name: Sergey Levine, focus: Robot learning and generalization }
    - { name: Chelsea Finn, focus: Robot learning and adaptation }
    - { name: Jim Fan, focus: Foundation models for robotics }
    - { name: Russ Tedrake, focus: "Robotics, control theory" }
    - { name: Daniela Rus, focus: Robotics and autonomous systems }
    - { name: Marc Raibert, focus: Legged robotics }
    - { name: Karol Hausman, focus: Robotics foundation models }
