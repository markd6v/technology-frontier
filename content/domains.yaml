# The 15 technology domains. Reference content for /d/[slug] pages.
# tier: deep (daily) | regular (weekly) | broad (weekly summary + monthly deep dive)

- slug: ai
  name: Artificial intelligence
  tier: deep
  relevance: Very high
  summary: >-
    Deserves several independent monitoring streams because model research,
    infrastructure, and commercial applications move at different speeds.
  subfields: [Foundation models, Reasoning, Multimodal AI, Agents, World models]
  research:
    - { name: arXiv cs.AI, url: https://arxiv.org/list/cs.AI/recent, note: General AI research }
    - { name: arXiv cs.LG, url: https://arxiv.org/list/cs.LG/recent, note: Machine learning breakthroughs }
    - { name: arXiv cs.CL, url: https://arxiv.org/list/cs.CL/recent, note: Language models and NLP }
    - { name: Hugging Face Papers, url: https://huggingface.co/papers, note: Trending research and implementations }
    - { name: OpenReview, url: https://openreview.net, note: Conference submissions and peer-review discussions }
    - { name: Google DeepMind, url: https://deepmind.google/research/, note: Frontier model research }
    - { name: OpenAI Research, url: https://openai.com/research/, note: New model capabilities and research }
    - { name: Anthropic Research, url: https://www.anthropic.com/research, note: Models, interpretability, and agent capabilities }
    - { name: Meta AI Research, url: https://ai.meta.com/research/, note: Open models and foundational research }
    - { name: Epoch AI, url: https://epoch.ai, note: Compute, scaling trends, model capabilities }
  conferences: [NeurIPS, ICML, ICLR, ACL, CVPR]
  products:
    - { name: OpenAI, url: https://openai.com/news/, note: Model releases, API capabilities, agents }
    - { name: Anthropic, url: https://www.anthropic.com/news, note: Claude, coding agents, enterprise AI }
    - { name: Google DeepMind, url: https://deepmind.google/discover/blog/, note: Gemini, multimodal AI, robotics }
    - { name: Meta AI, url: https://ai.meta.com/blog/, note: Open-weight models, consumer AI }
    - { name: Mistral AI, url: https://mistral.ai/news, note: Efficient models and enterprise deployment }
    - { name: Hugging Face, url: https://huggingface.co/blog, note: Open-source models and tools }
    - { name: Cursor, url: https://cursor.com/blog, note: AI-native software development }
    - { name: GitHub, url: https://github.blog, note: Copilot and developer workflows }
    - { name: Artificial Analysis, url: https://artificialanalysis.ai, note: Independent model performance, pricing, speed }
  people:
    - { name: Andrej Karpathy, focus: "Deep technical intuition, AI engineering, education", priority: true }
    - { name: Ilya Sutskever, focus: Foundational model research and scaling, priority: true }
    - { name: Demis Hassabis, focus: Frontier AI and scientific applications, priority: true }
    - { name: Dario Amodei, focus: "Scaling, AI capabilities, commercialization" }
    - { name: Yann LeCun, focus: "Alternative architectures, world models" }
    - { name: Fei-Fei Li, focus: "Computer vision, spatial intelligence" }
    - { name: François Chollet, focus: "Reasoning, generalization, AI evaluation", priority: true }
    - { name: Jim Fan, focus: "Embodied AI, agents, robotics", priority: true }
    - { name: Jeff Dean, focus: Large-scale AI infrastructure and research }
    - { name: Andrew Ng, focus: Practical AI applications and commercialization }
    - { name: Swyx (Shawn Wang), focus: AI engineering ecosystem and developer trends }
    - { name: Simon Willison, focus: Hands-on LLM experiments and developer tools, priority: true, url: https://simonwillison.net }
  signals:
    - Cost per successfully completed task
    - Long-horizon agent reliability
    - Performance on previously unsolved benchmarks
    - New capabilities appearing in small models
    - Open-weight models approaching proprietary model performance
    - Improvements in inference efficiency
    - Adoption of autonomous workflows
  notes:
    - >-
      A model becoming 20% better on a benchmark is less commercially meaningful than a
      model becoming reliable enough to perform a previously impossible business workflow.
    - Compare model announcements with independent measurements (Artificial Analysis).

- slug: compute
  name: Computing infrastructure
  tier: deep
  relevance: Very high
  summary: The infrastructure needed to run increasingly demanding software and AI systems.
  subfields: [GPUs, Accelerators, Cloud, Distributed computing, Networking]
