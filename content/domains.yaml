    - { name: Dennis Whyte, focus: Fusion engineering }
    - { name: Bob Mumgaard, focus: Fusion commercialization }
    - { name: Jesse Jenkins, focus: Electricity systems }
    - { name: Leah Stokes, focus: Energy policy and deployment }
    - { name: Saul Griffith, focus: Electrification }
  signals:
    - Levelized cost of electricity
    - Cost per installed kilowatt
    - Capacity factor
    - Fusion energy gain and engineering milestones
    - Construction timelines
    - Grid connection delays
    - Regulatory approvals
    - First commercial deployments
