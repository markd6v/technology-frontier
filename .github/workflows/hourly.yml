# Hourly ingestion trigger. Vercel Hobby cron can only run daily (ARCHITECTURE §1, §9).
# Needs repo secrets: APP_URL (e.g. https://technology-frontier.vercel.app) and CRON_SECRET.
name: hourly-ingest

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch every source, ignoring next_due_at"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger /api/jobs/ingest
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set; skipping"; exit 0; fi
          curl --fail-with-body -sS -X POST --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/ingest?force=$FORCE"
